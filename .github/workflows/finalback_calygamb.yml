name: CI/CD Java para Azure
on:
  push:
    branches: [ "finalback" ] # Alterado para a branch do seu projeto
  pull_request:
    branches: [ "finalback" ]
  workflow_dispatch: # Mantido para execução manual

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Necessário para login no Azure
    steps:
      - name: Checar código
        uses: actions/checkout@v4 # Atualizado para v4, conforme a pipeline anterior

      - name: Instalar Java 21
        uses: actions/setup-java@v4 # Atualizado para v4, conforme a pipeline anterior
        with:
          java-version: '21'
          distribution: 'microsoft' # Usando a distribuição do projeto anterior

      - name: Build com Maven (skip tests)
        run: mvn clean install -DskipTests -e -X # <-- agora pula os testes
        env:
          MAVEN_OPTS: "-Xms512m -Xmx1024m"

      - name: Verificar arquivo JAR
        run: |
          echo "=== Verificando arquivos na pasta target ==="
          ls -la target/
          echo ""
          echo "=== Verificando arquivos JAR ==="
          ls -la target/*.jar
          echo ""
          echo "=== Verificando se o arquivo específico existe ==="
          if [ -f "target/calygamb-0.0.1-SNAPSHOT.jar" ]; then
            echo "✅ Arquivo calygamb-0.0.1-SNAPSHOT.jar encontrado!"
            echo "Tamanho: $(ls -lh target/calygamb-0.0.1-SNAPSHOT.jar | awk '{print $5}')"
          else
            echo "❌ Arquivo calygamb-0.0.1-SNAPSHOT.jar NÃO encontrado!"
            echo "Arquivos disponíveis:"
            ls -la target/*.jar
          fi

      - name: Deploy para Azure Web App
        uses: azure/webapps-deploy@v3 # Atualizado para v3, conforme a pipeline anterior
        with:
          app-name: "calygamb" # Nome do app do projeto anterior
          slot-name: "Production" # Slot do projeto anterior
          package: target/*.jar # Pacote genérico para o JAR
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_439CF8ACFA60475F8943A1570718DDED }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_93EB59CB803245C8870D308118F6B35A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9430857331774E8991897E5F1E6032C7 }}
