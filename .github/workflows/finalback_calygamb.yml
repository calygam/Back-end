name: CI/CD Java para Azure

on:
  push:
    branches: [ "finalback" ]  
  pull_request:
    branches: [ "finalback" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checar código
        uses: actions/checkout@v3

      - name: Instalar Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build com Maven
        run: mvn clean install -DskipTests

      - name: Verificar arquivo JAR
        run: |
          echo "=== Verificando arquivos na pasta target ==="
          ls -la target/
          echo ""
          echo "=== Verificando arquivos JAR ==="
          ls -la target/*.jar
          echo ""
          echo "=== Verificando se o arquivo específico existe ==="
          if [ -f "target/back-0.0.1-SNAPSHOT.jar" ]; then
            echo "✅ Arquivo back-0.0.1-SNAPSHOT.jar encontrado!"
            echo "Tamanho: $(ls -lh target/back-0.0.1-SNAPSHOT.jar | awk '{print $5}')"
          else
            echo "❌ Arquivo back-0.0.1-SNAPSHOT.jar NÃO encontrado!"
            echo "Arquivos disponíveis:"
            ls -la target/*.jar
          fi

      - name: Deploy para Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: "calygam"  
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: target/back-0.0.1-SNAPSHOT.jar
