# Nome do Workflow
name: CI/CD Pipeline - Deploy Java App to Azure Web App

# Gatilho (trigger)
# Este workflow será executado em cada push para a branch 'main'
on:
  push:
    branches:
      - backcalygam
  # Permite que você execute este workflow manualmente na aba Actions do GitHub
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
     
    # 1. Checkout do código
    steps:
      - name: 'Checkout do código'
        uses: actions/checkout@v4

    # 2. Build e Deploy no Azure Web App for Containers
    - name: 'Deploy to Azure Web App'
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'esqueltin'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        images: 'Dockerfile'
