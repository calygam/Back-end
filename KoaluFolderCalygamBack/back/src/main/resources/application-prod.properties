spring.application.name=back


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.show_sql=true
server.port=8080
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
api.security.token.secret=${SECRET_KEY}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_PROD_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_PROD_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${SERVER_PROD_URL:https://trail-dff8ahgzdkhvhbe8.brazilsouth-01.azurewebsites.net/auth/google/callback

# Server Configuration
server.url=https://trail-dff8ahgzdkhvhbe8.brazilsouth-01.azurewebsites.net
